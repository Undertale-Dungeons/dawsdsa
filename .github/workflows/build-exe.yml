name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "WindowsSecurityHealth.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WindowsSecurityHealth WindowsSecurityHealth.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSecurityHealth-Windows
          path: dist/WindowsSecurityHealth.exe
          if-no-files-found: error
